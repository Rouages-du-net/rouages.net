  - { id: next, nom: Next, url: 'https://next.ink/feed/', site: 'https://next.ink/', themes: [regulation, ia], modules: [], langue: fr, max_items: 8, extrait: false }
  - { id: linuxfr, nom: LinuxFr.org, dépêches, url: 'https://linuxfr.org/news.atom', site: 'https://linuxfr.org/', themes: [reseau], modules: [linux], langue: fr, max_items: 3, extrait: false }

