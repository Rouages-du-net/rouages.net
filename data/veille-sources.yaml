  # — Sécurité et réseau
  - { id: cert-fr, nom: CERT-FR (ANSSI), actualités, url: 'https://cert.cyber.gouv.fr/actualite/feed/', site: 'https://cert.cyber.gouv.fr/', themes: [securite], modules: [se-proteger], langue: fr, max_items: 3 }
