# Sources de la veille (page /veille/). Fichier relu par un humain : ajouter une
# source est une décision éditoriale (voir docs/VEILLE.md).
#
# Champs :
#   id        identifiant stable, en minuscules avec tirets
#   nom       nom affiché
#   url       adresse du flux RSS ou Atom (vérifiée à l'ajout)
#   site      page d'accueil
#   themes    un ou plusieurs parmi : gouvernance, regulation, securite, ia, savoirs, reseau, libertes
#   modules   modules du site que la source concerne en général (slug de /modules/<slug>/)
#   langue    fr ou en
#   max_items nombre maximal d'items retenus par passage (défaut 6)
#   mots_cles si présent, un item n'est retenu que si son titre ou son extrait contient l'un des mots
#   extrait   false pour n'afficher que le titre (presse : titres et liens seulement)
#   actif     false pour suspendre une source sans la supprimer

sources:
  # — Qui décide : régulateurs et institutions
  - { id: cnil, nom: CNIL, url: 'https://www.cnil.fr/fr/rss.xml', site: 'https://www.cnil.fr/', themes: [regulation], modules: [etats-regulation, surveillance-vie-privee], langue: fr, max_items: 5 }
  - { id: arcom, nom: Arcom, url: 'https://www.arcom.fr/rss.xml', site: 'https://www.arcom.fr/', themes: [regulation], modules: [etats-regulation], langue: fr, max_items: 4 }
  - { id: cepd, nom: Comité européen de la protection des données, url: 'https://www.edpb.europa.eu/feed/news_en', site: 'https://www.edpb.europa.eu/', themes: [regulation], modules: [etats-regulation], langue: en, max_items: 4 }
  - { id: commission-numerique, nom: Commission européenne (stratégie numérique), url: 'https://digital-strategy.ec.europa.eu/en/rss.xml', site: 'https://digital-strategy.ec.europa.eu/', themes: [regulation], modules: [etats-regulation], langue: en, max_items: 6 }
  - { id: conseil-etat, nom: Conseil d'État, url: 'https://www.conseil-etat.fr/outils/flux-rss/actualites-rss', site: 'https://www.conseil-etat.fr/', themes: [regulation], modules: [], langue: fr, max_items: 4, mots_cles: [numérique, internet, algorithm, données personnelles, vidéoprotection, vidéosurveillance, intelligence artificielle, CNIL, réseaux sociaux] }
  - { id: ietf, nom: IETF, blog, url: 'https://www.ietf.org/blog/feed/', site: 'https://www.ietf.org/', themes: [gouvernance, reseau], modules: [gouvernance-technique], langue: en, max_items: 4 }
