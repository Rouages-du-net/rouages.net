  - { id: ripe-labs, nom: RIPE Labs, url: 'https://labs.ripe.net/feed.xml', site: 'https://labs.ripe.net/', themes: [reseau, gouvernance], modules: [gouvernance-technique], langue: en, max_items: 3 }
