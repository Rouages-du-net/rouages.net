name: Déployer sur cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Playwright 1.56 ne prend pas en charge Ubuntu 26.04 (ubuntu-latest) : on fixe 24.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - name: Tests unitaires
        run: npm test
      - run: npm run build
      # Un échec des tests bloque l'envoi : le site en ligne reste dans son état précédent.
      - name: Navigateur Chromium
        run: npx playwright install --with-deps chromium
      - name: Tests dans le navigateur
        run: npm run test:navigateur

      # Les tests tournent sur une version sans mesure d'audience (aucun appel à
      # l'instance Umami). On reconstruit ensuite la version de production avec
      # les variables du dépôt (Settings → Secrets and variables → Actions →
      # Variables) : PUBLIC_UMAMI_SRC (adresse du script de l'instance Umami) et
      # PUBLIC_UMAMI_WEBSITE_ID. Si l'une manque, rien n'est ajouté au site.
      - name: Version de production (avec mesure d'audience)
        run: npm run build
        env:
          PUBLIC_UMAMI_SRC: ${{ vars.PUBLIC_UMAMI_SRC }}
          PUBLIC_UMAMI_WEBSITE_ID: ${{ vars.PUBLIC_UMAMI_WEBSITE_ID }}

      - name: Envoi FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR || './' }}
